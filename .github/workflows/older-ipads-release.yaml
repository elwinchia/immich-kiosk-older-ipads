# fork (immich-kiosk-older-ipads): builds and pushes the image when a v<upstream>-ipad.<n> tag
# is pushed. Upstream's own release workflows are disabled in this repo's Actions settings.
name: Older-iPads Release

on:
  push:
    tags: ["v*-ipad.*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # the release stage runs apk under each platform
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/immich-kiosk-older-ipads
          docker buildx build --build-arg VERSION=$VERSION \
            --platform linux/amd64,linux/arm64 \
            --push \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=AGPL-3.0" \
            -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest .
